server:
  port: 8080

review:
  # Token needs: Pull requests (read/write), Contents (read), Commit statuses (read/write).
  # Never put the token itself in this file; set it in the environment.
  github-token:
  webhook-secret:
  status-context: rule-review



  # CI gate (AC7): every evaluated commit gets a summary review, and the status check links to it.
  ci:
    summary-on-approve: true   # also post a summary on clean PRs (false: only the green status)

  # Automatic PR polling. Finds PRs that need a review and sends them to /webhook.
  # Works alongside the real GitHub webhook; PRs already reviewed are skipped.
  poller:
    enabled: ${POLLER_ENABLED:false}
    # Comma-separated owner/repo list
    repos: "${POLLER_REPOS:}"
    # Spring cron: sec min hour day month weekday. Default = every 5 minutes.
    cron: "${POLLER_CRON:0 0/5 * * * *}"
    webhook-url: http://localhost:${server.port}/webhook

  # Merge verdict policy (deterministic). Checked top to bottom:
  #   any finding at a block-on severity           -> BLOCK
  #   else any finding at a request-changes-on one -> REQUEST_CHANGES
  #   else                                         -> APPROVE
  # A severity in neither list is advisory (reported, never affects the verdict).
  verdict:
    block-on: [BLOCK, ERROR]
    request-changes-on: [WARNING]
    fail-gate-on: [BLOCK, REQUEST_CHANGES]   # verdicts that turn the rule-review status red

  # Path prefixes the bot never reviews
  exclude-paths:
    - "target/"
    - "src/main/generated/"
    - "samples/"            # demo PRs in this repo; they break the rules on purpose
    - "samples-rejudge/"    # the fix-and-rejudge demo PR (AC6), same reason

  # Per-rule overrides. Omit a rule to use its defaults.
  # severity: WARNING | ERROR | BLOCK   (category is fixed per rule)
  rules:
    no-system-out:
      enabled: true
      severity: ERROR
    no-field-injection:
      enabled: true
      severity: WARNING
    max-method-length:
      enabled: true
      severity: WARNING
      params:
        max-lines: "50"
    layer-dependency:          # ARCHITECTURE: controllers must not import repositories
      enabled: true
      severity: ERROR
